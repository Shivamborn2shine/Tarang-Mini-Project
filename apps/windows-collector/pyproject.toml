[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarang-win-collector"
version = "0.1.0"
description = "TARANG Windows WLAN probe and collector"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
tarang-win-probe = "tarang_win.probe:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tarang_win*"]
