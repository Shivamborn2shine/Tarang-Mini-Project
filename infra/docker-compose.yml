services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tarang-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarang_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-tarang}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tarang_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarang} -d ${POSTGRES_DB:-tarang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    container_name: tarang-api
    environment:
      TARANG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tarang}:${POSTGRES_PASSWORD:-tarang_dev_only}@db:5432/${POSTGRES_DB:-tarang}
      TARANG_HOST: 0.0.0.0
      TARANG_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tarang_pgdata:
